# tmux config. Reload with `prefix + r`.

# ============================================================================
# Options
# ============================================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB,xterm-ghostty:RGB"
set -s extended-keys on                                                     # forward Shift+Enter etc. through tmux
set -as terminal-features 'xterm*:extkeys'
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off                                                # Stay in tmux when session is destroyed
set -g escape-time 0
set -g focus-events on                                                      # Allow events like notifications to pass through tmux to ghostty
set -g history-limit 1000000
set -g set-clipboard on
set -g mouse on                                                             # Mouse support (scroll, select panes, etc.)
set -gq allow-passthrough on
setw -g mode-keys vi
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval 5                                           # auto-save sessions every 5 min

# ============================================================================
# Keybindings
# ============================================================================
# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind '"'                                                                  # unbind default vertical split
unbind %                                                                    # unbind default horizontal split
bind | split-window -h -c "#{pane_current_path}"                            # prefix + | → split horizontal
bind - split-window -v -c "#{pane_current_path}"                            # prefix + - → split vertical
bind c new-window -c "#{pane_current_path}"                                 # prefix + c → new window (preserve cwd)
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"    # prefix + r → reload config
bind x kill-pane                                                            # prefix + x → kill pane (no confirm)
bind S command-prompt -p "New session:" "new-session -s '%%'"               # prefix + S → new session (name prompt)
bind -r h resize-pane -L 5                                                  # prefix + h → resize pane left
bind -r j resize-pane -D 5                                                  # prefix + j → resize pane down
bind -r k resize-pane -U 5                                                  # prefix + k → resize pane up
bind -r l resize-pane -R 5                                                  # prefix + l → resize pane right
bind -r < swap-window -t -1 \; select-window -t -1                          # prefix + < → move window left
bind -r > swap-window -t +1 \; select-window -t +1                          # prefix + > → move window right
bind -T copy-mode-vi v send -X begin-selection                              # copy-mode v → begin selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel                    # copy-mode y → copy + exit


# ============================================================================
# Styling
# ============================================================================
# Catppuccin theme settings
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Status bar general
set -g status-interval 5                                                    # How often to refresh tmux status bar
set -g status-position bottom
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# Status bar top padding
set -g status 2
set -g status-format[0] "#[bg=terminal]"
set -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"

# Status bar left
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,  zoom ,}"

# Status bar center
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_overlay_1}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_blue},fg=#{@thm_bg},bold"

# Status bar right
set -g status-right-length 250
set -g status-right ""
set -ga status-right "#(gitmux -cfg $HOME/.gitmux.conf \"#{pane_current_path}\")"

# ============================================================================
# Plugins
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TPM (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
